<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>

<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    body { margin: 0; background: #F0F1F3; }
    a { color: #C41230; }
    a:hover { color: #A10E27; }
  </style>
</helmet>

<div style="min-height:100vh; box-sizing:border-box; font-family:'Inter',sans-serif; color:#1A1A1A; background:#F0F1F3; padding:32px 24px; display:flex; align-items:center; justify-content:center;">

  <div style="width:100%; max-width:1000px; min-height:620px; background:#fff; border-radius:12px; box-shadow:0 24px 60px rgba(0,0,0,0.12); overflow:hidden; display:flex; flex-wrap:wrap;">

    <div style="flex:0.8 1 320px; min-width:260px; position:relative; overflow:hidden;">
      <img src="./assets/login-photo.jpg" alt="" style="position:absolute; inset:0; width:100%; height:100%; object-fit:cover;" />
      <div style="position:absolute; inset:0; background:linear-gradient(180deg, rgba(0,0,0,0.55) 0%, rgba(0,0,0,0.05) 30%, rgba(0,0,0,0.15) 60%, rgba(0,0,0,0.82) 100%);"></div>

      <div style="position:absolute; top:32px; left:32px; display:flex; align-items:center; gap:10px; z-index:1;">
        <svg width="34" height="34" viewBox="0 0 512 512" style="flex-shrink:0;">
          <defs><clipPath id="icLoginPhoto"><circle cx="256" cy="248" r="150"/></clipPath></defs>
          <rect x="16" y="16" width="480" height="480" rx="92" ry="92" fill="#ffffff" stroke="#EDEEF0" stroke-width="4"/>
          <g clip-path="url(#icLoginPhoto)">
            <path d="M 256 248 L 256 98 A 150 150 0 0 1 386 323 Z" fill="#0072bc" opacity="0.3"/>
            <path d="M 256 248 L 386 323 A 150 150 0 0 1 126 323 Z" fill="#e31c79" opacity="0.3"/>
            <path d="M 256 248 L 126 323 A 150 150 0 0 1 256 98 Z" fill="#f5a623" opacity="0.3"/>
          </g>
          <circle cx="256" cy="248" r="192" fill="none" stroke="#C41230" stroke-width="24" stroke-dasharray="34 22" stroke-linecap="round"/>
          <circle cx="256" cy="248" r="165" fill="none" stroke="#C41230" stroke-width="24" stroke-dasharray="30 19" stroke-linecap="round"/>
          <path d="M 168 248 L 224 304 L 344 178" fill="none" stroke="#ffffff" stroke-width="70" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M 168 248 L 224 304 L 344 178" fill="none" stroke="#C41230" stroke-width="52" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <div style="font-family:'Poppins',sans-serif; font-weight:800; font-size:15px; letter-spacing:-0.01em; white-space:nowrap;"><span style="color:#fff;">SE</span><span style="color:#F5919E;">BENAR</span><span style="color:#fff;">NYA.MY</span></div>
      </div>

      <div style="position:absolute; bottom:32px; left:32px; right:32px; z-index:1;">
        <div style="font-family:'Poppins',sans-serif; font-weight:700; font-size:22px; color:#fff; line-height:1.4; margin-bottom:14px;">"Tidak Pasti, Jangan Kongsi"</div>
        <div style="font-size:13px; font-weight:700; color:#fff;">MCMC Fact-Check Desk</div>
        <div style="font-size:12px; color:rgba(255,255,255,0.75);">Malaysian Communications and Multimedia Commission</div>
      </div>
    </div>

    <div style="flex:1 1 380px; min-width:320px; box-sizing:border-box; padding:48px 44px; display:flex; flex-direction:column; align-items:center; justify-content:center;">
      <div style="width:100%; max-width:340px;">

        <div style="display:flex; background:#F3F4F6; border-radius:10px; padding:4px; gap:4px; margin-bottom:26px;">
          <sc-for list="{{ roleTabs }}" as="rt" hint-placeholder-count="3">
            <div onClick="{{ rt.onClick }}" style="flex:1; text-align:center; padding:8px 6px; border-radius:8px; font-size:12.5px; font-weight:700; cursor:pointer; background:{{ rt.bg }}; color:{{ rt.color }}; box-shadow:{{ rt.shadow }}; transition:background 0.15s;">{{ rt.label }}</div>
          </sc-for>
        </div>

        <div style="font-family:'Poppins',sans-serif; font-weight:700; font-size:23px; margin-bottom:6px;">{{ roleHeading }}</div>
        <div style="font-size:13px; color:#8A8F98; margin-bottom:26px; line-height:1.5;">{{ roleSubtitle }}</div>

        <form onSubmit="{{ handleSubmit }}" style="display:flex; flex-direction:column; gap:16px;">
      <div>
        <input
          type="text"
          value="{{ email }}"
          onChange="{{ onEmailChange }}"
          placeholder="{{ emailPlaceholder }}"
          style="width:100%; box-sizing:border-box; height:44px; padding:0 12px; border-radius:9px; background:#F3F4F6; border:{{ emailBorder }}; box-shadow:{{ emailShadow }}; font-family:'Inter',sans-serif; font-size:14px; outline:none;"
        />
        <sc-if value="{{ emailError }}" hint-placeholder-val="{{ false }}">
          <div style="font-size:12px; color:#C41230; margin-top:6px;">{{ emailError }}</div>
        </sc-if>
      </div>

      <div>
        <div style="position:relative;">
          <input
            type="{{ passwordInputType }}"
            value="{{ password }}"
            onChange="{{ onPasswordChange }}"
            placeholder="Password"
            style="width:100%; box-sizing:border-box; height:44px; padding:0 40px 0 12px; border-radius:9px; background:#F3F4F6; border:{{ passwordBorder }}; box-shadow:{{ passwordShadow }}; font-family:'Inter',sans-serif; font-size:14px; outline:none;"
          />
          <div onClick="{{ togglePassword }}" style="position:absolute; right:12px; top:50%; transform:translateY(-50%); width:18px; height:18px; cursor:pointer; color:#8A8F98; display:flex; align-items:center; justify-content:center;">
            <sc-if value="{{ showPassword }}" hint-placeholder-val="{{ false }}">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M3 3l18 18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M10.6 5.2A10.6 10.6 0 0112 5c6.5 0 10 6 10 6a15.6 15.6 0 01-3.3 4M6.6 6.6C4 8.3 2 12 2 12s1.6 3 4.6 4.7M9.9 14.1a3 3 0 004.2-4.2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </sc-if>
            <sc-if value="{{ showPasswordOff }}" hint-placeholder-val="{{ true }}">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6-10-6-10-6z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><circle cx="12" cy="12" r="2.6" stroke="currentColor" stroke-width="1.8"/></svg>
            </sc-if>
          </div>
        </div>
        <sc-if value="{{ passwordError }}" hint-placeholder-val="{{ false }}">
          <div style="font-size:12px; color:#C41230; margin-top:6px;">{{ passwordError }}</div>
        </sc-if>
      </div>

      <div style="display:flex; align-items:center; justify-content:space-between; margin-top:-6px;">
        <label style="display:flex; align-items:center; gap:7px; font-size:13px; color:#4B4F58; cursor:pointer;">
          <input type="checkbox" checked="{{ rememberMe }}" onChange="{{ onRememberChange }}" style="width:15px; height:15px; accent-color:#C41230; cursor:pointer;" />
          Remember Me
        </label>
        <a href="#" onClick="{{ onForgotClick }}" style="font-size:13px; color:#C41230; text-decoration:none; font-weight:500;">Forgot Password</a>
      </div>

      <sc-if value="{{ loginMessage }}" hint-placeholder-val="{{ false }}">
        <div style="font-size:13px; color:{{ loginMessageColor }}; background:{{ loginMessageBg }}; border-radius:8px; padding:10px 12px;">{{ loginMessage }}</div>
      </sc-if>

      <button type="submit" style="height:46px; border-radius:9px; background:#C41230; color:#fff; border:none; font-family:'Inter',sans-serif; font-weight:600; font-size:14px; cursor:pointer; margin-top:4px; transform:translateY(0); box-shadow:0 2px 6px rgba(196,18,48,0.25); transition:transform 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;" style-hover="background:#A10E27; transform:translateY(-2px); box-shadow:0 8px 18px rgba(196,18,48,0.35);" style-active="background:#8A0D22; transform:translateY(0); box-shadow:0 2px 6px rgba(196,18,48,0.25);">{{ submitLabel }}</button>

      <sc-if value="{{ isPublicRole }}" hint-placeholder-val="{{ true }}">
        <button type="button" onClick="{{ onGoogleClick }}" style="height:46px; border-radius:9px; background:#fff; color:#1A1A1A; border:1.5px solid #E4E5E9; font-family:'Inter',sans-serif; font-weight:600; font-size:14px; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:10px; transform:translateY(0); box-shadow:0 1px 2px rgba(0,0,0,0.04); transition:transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease, background 0.15s ease;" style-hover="background:#F7F7F8; border-color:#C9CBD1; transform:translateY(-2px); box-shadow:0 8px 16px rgba(0,0,0,0.10);" style-active="background:#EDEEF0; transform:translateY(0); box-shadow:0 1px 2px rgba(0,0,0,0.04);">
          <svg width="17" height="17" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.1 8 3l6-6C34.5 5.1 29.5 3 24 3 12.4 3 3 12.4 3 24s9.4 21 21 21 21-9.4 21-21c0-1.2-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.6 15.9 18.9 13 24 13c3.1 0 5.8 1.1 8 3l6-6C34.5 5.1 29.5 3 24 3 16.3 3 9.7 7.4 6.3 14.7z"/><path fill="#4CAF50" d="M24 45c5.4 0 10.3-2.1 14-5.5l-6.5-5.3C29.5 35.9 26.9 37 24 37c-5.2 0-9.6-3.3-11.3-8l-6.6 5.1C9.6 40.5 16.2 45 24 45z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-1.1 3-3.4 5.3-6.3 6.7l6.5 5.3C39.5 36.7 45 30.9 45 24c0-1.2-.1-2.4-.4-3.5z"/></svg>
          Sign in with Google
        </button>
      </sc-if>
    </form>

    <sc-if value="{{ isPublicRole }}" hint-placeholder-val="{{ true }}">
      <div style="margin-top:22px; font-size:13px; color:#8A8F98; text-align:center;">
        Don't have an account yet? <a href="#" onClick="{{ onCreateAccount }}" style="font-weight:600; text-decoration:none;">Sign Up</a>
      </div>
    </sc-if>
  </div>
</div>
</div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = {
    role: 'public',
    email: '',
    password: '',
    showPassword: false,
    rememberMe: false,
    submitted: false,
    loginMessage: ''
  };

  isValidEmail(v) {
    return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v);
  }

  destFor(role) {
    return role === 'mcmc' ? './05-mcmc-auth-dashboard.dc.html'
      : role === 'agency' ? './08-agency-auth-dashboard.dc.html'
      : './03-public-core.dc.html';
  }

  handleSubmit(e) {
    e.preventDefault();
    const hasEmailError = !this.state.email || !this.isValidEmail(this.state.email);
    const hasPasswordError = !this.state.password;
    this.setState({ submitted: true });
    if (!hasEmailError && !hasPasswordError) {
      window.location.href = this.destFor(this.state.role);
    } else {
      this.setState({ loginMessage: '' });
    }
  }

  renderVals() {
    const s = this.state;
    const emailError = s.submitted && !s.email ? 'Email is required.'
      : s.submitted && !this.isValidEmail(s.email) ? 'Enter a valid email address.'
      : '';
    const passwordError = s.submitted && !s.password ? 'Password is required.' : '';

    const normalBorder = '1px solid #D4D6DA';
    const errorBorder = '1.5px solid #C41230';
    const errorShadow = '0 0 0 3px rgba(196,18,48,0.10)';

    const roleCopy = {
      public: { heading: 'Welcome Back', sub: 'Verify news, one inquiry at a time.', emailPh: 'Email', submit: 'Login' },
      mcmc: { heading: 'MCMC Staff Login', sub: 'Sign in to triage, assign, and manage inquiries.', emailPh: 'Staff Email', submit: 'Login as MCMC Staff' },
      agency: { heading: 'Agency Partner Login', sub: 'Sign in to review and investigate assigned inquiries.', emailPh: 'Agency Email', submit: 'Login as Agency Staff' }
    };
    const rc = roleCopy[s.role];

    const roleTabs = [
      { key: 'public', label: 'Public' },
      { key: 'mcmc', label: 'MCMC Staff' },
      { key: 'agency', label: 'Agency Partner' }
    ].map(t => ({
      label: t.label,
      bg: s.role === t.key ? '#fff' : 'transparent',
      color: s.role === t.key ? '#C41230' : '#6B6F76',
      shadow: s.role === t.key ? '0 1px 3px rgba(0,0,0,0.12)' : 'none',
      onClick: () => this.setState({ role: t.key, submitted: false, loginMessage: '' })
    }));

    return {
      roleTabs,
      roleHeading: rc.heading, roleSubtitle: rc.sub, emailPlaceholder: rc.emailPh, submitLabel: rc.submit,
      isPublicRole: s.role === 'public',
      email: s.email,
      password: s.password,
      showPassword: s.showPassword, showPasswordOff: !s.showPassword,
      passwordInputType: s.showPassword ? 'text' : 'password',
      rememberMe: s.rememberMe,
      onRememberChange: () => this.setState(st => ({ rememberMe: !st.rememberMe })),
      onGoogleClick: () => this.setState({ loginMessage: 'Google sign-in is not available in this demo.' }),
      emailError,
      passwordError,
      emailBorder: emailError ? errorBorder : normalBorder,
      emailShadow: emailError ? errorShadow : 'none',
      passwordBorder: passwordError ? errorBorder : normalBorder,
      passwordShadow: passwordError ? errorShadow : 'none',
      loginMessage: s.loginMessage,
      loginMessageColor: s.loginMessage ? '#4B4F58' : '',
      loginMessageBg: s.loginMessage ? '#F0F1F3' : '',
      onEmailChange: (e) => this.setState({ email: e.target.value }),
      onPasswordChange: (e) => this.setState({ password: e.target.value }),
      togglePassword: () => this.setState(st => ({ showPassword: !st.showPassword })),
      handleSubmit: (e) => this.handleSubmit(e),
      onForgotClick: (e) => { e.preventDefault(); window.location.href = './02-public-auth-flow.dc.html?screen=forgot'; },
      onCreateAccount: () => { window.location.href = './02-public-auth-flow.dc.html?screen=register'; }
    };
  }
}

</script>
</body>
</html>
